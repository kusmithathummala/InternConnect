
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | InternConnect</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/login.css">

    <script src="/auth.js" defer></script>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="brand">InternConnect</a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="/">Find Internships</a>
                <a href="/admin-login.html">Admin Account</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-container">

            <div class="auth-brand-icon">IC</div>

            <p class="auth-eyebrow">WELCOME BACK</p>

            <h1>Login to InternConnect</h1>

            <p class="auth-description">
                Login to continue your internship journey,
                explore opportunities, and manage your applications.
            </p>

            <form id="loginForm" class="auth-form">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="150"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        maxlength="72"
                        required>
                </div>

                <p id="message"
                   class="auth-message"
                   role="status"
                   aria-live="polite"></p>

                <button type="submit" class="auth-submit">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="/register.html">Create an account</a>
            </p>

            <a href="/" class="auth-back-link">
                ← Back to internships
            </a>

        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 InternConnect. Start building your future.</p>
    </footer>

</body>
</html>
