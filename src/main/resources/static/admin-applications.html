
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Applications | InternConnect</title>
    <link rel="stylesheet" href="/admin-applications.css">
    <script src="/admin-applications.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/admin-dashboard.html">InternConnect</a>
            <nav>
                <a href="/admin-dashboard.html">Dashboard</a>
                <a href="/admin-internships.html">Internships</a>
                <button id="logoutButton" type="button">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-heading">
            <p class="eyebrow">ADMINISTRATION</p>
            <h1>Manage Applications</h1>
            <p>Review student applications and update their status.</p>
        </section>

        <section class="summary-grid">
            <article class="summary-card">
                <p>Total Applications</p>
                <h2 id="totalCount">0</h2>
            </article>
            <article class="summary-card">
                <p>Pending</p>
                <h2 id="pendingCount">0</h2>
            </article>
            <article class="summary-card">
                <p>Accepted</p>
                <h2 id="acceptedCount">0</h2>
            </article>
            <article class="summary-card">
                <p>Rejected</p>
                <h2 id="rejectedCount">0</h2>
            </article>
        </section>

        <section class="applications-section">
            <div class="list-heading">
                <h2>Student Applications</h2>
                <button id="refreshButton" type="button">Refresh</button>
            </div>

            <div class="filters">
                <label for="statusFilter">Filter by status</label>
                <select id="statusFilter">
                    <option value="All">All Applications</option>
                    <option value="Pending">Pending</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>

            <p id="pageMessage" role="status" aria-live="polite"></p>
            <div id="applicationsList" class="applications-list"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 InternConnect. All rights reserved.</p>
    </footer>
</body>
</html>
