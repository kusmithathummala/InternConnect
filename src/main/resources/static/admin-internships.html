
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Internships | InternConnect</title>
    <link rel="stylesheet" href="/admin-internships.css">
    <script src="/admin-internships.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/admin-dashboard.html">InternConnect</a>
            <nav>
                <a href="/admin-dashboard.html">Dashboard</a>
                <button id="logoutButton" type="button">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-heading">
            <p class="eyebrow">ADMINISTRATION</p>
            <h1>Manage Internships</h1>
            <p>Add new opportunities or update existing listings.</p>
        </section>

        <section class="form-card">
            <h2 id="formTitle">Add New Internship</h2>

            <form id="internshipForm">
                <input type="hidden" id="internshipId">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="title">Internship Title *</label>
                        <input id="title" maxlength="150" required>
                    </div>

                    <div class="form-group">
                        <label for="company">Company *</label>
                        <input id="company" maxlength="150" required>
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <input id="location" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="internshipType">Internship Type</label>
                        <select id="internshipType">
                            <option value="">Select type</option>
                            <option value="Technical">Technical</option>
                            <option value="Non-Technical">Non-Technical</option>
                            <option value="Management">Management</option>
                            <option value="Design">Design</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="workMode">Work Mode</label>
                        <select id="workMode">
                            <option value="">Select mode</option>
                            <option value="Remote">Remote</option>
                            <option value="Hybrid">Hybrid</option>
                            <option value="On-site">On-site</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="duration">Duration</label>
                        <input id="duration" maxlength="50"
                               placeholder="e.g. 3 Months">
                    </div>

                    <div class="form-group">
                        <label for="stipend">Stipend</label>
                        <input id="stipend" maxlength="100"
                               placeholder="e.g. ₹10,000 per month">
                    </div>

                    <div class="form-group">
                        <label for="deadline">Application Deadline</label>
                        <input id="deadline" type="date">
                    </div>

                    <div class="form-group full-width">
                        <label for="skills">Required Skills</label>
                        <input id="skills" maxlength="255"
                               placeholder="Java, Spring Boot, SQL">
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea id="description" rows="4"
                                  placeholder="Describe the internship..."></textarea>
                    </div>
                </div>

                <p id="formMessage" role="alert" aria-live="polite"></p>

                <div class="form-actions">
                    <button type="submit" id="saveButton">Add Internship</button>
                    <button type="button" id="cancelButton" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <section class="list-section">
            <div class="list-heading">
                <h2>Existing Internships</h2>
                <button type="button" id="refreshButton">Refresh</button>
            </div>

            <p id="listMessage" role="status" aria-live="polite"></p>
            <div id="internshipList" class="internship-list"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 InternConnect. All rights reserved.</p>
    </footer>
</body>
</html>
